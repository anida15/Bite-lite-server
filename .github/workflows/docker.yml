name: Deploy Bite-Lite

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bite-lite-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            /opt/deploy.sh bite-lite